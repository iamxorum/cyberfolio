name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# The workflow only reads the repo, so the token gets read-only access.
permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Use example config (real config is gitignored)
        run: cp -r config.example/. src/config/

      - name: Use example blog content (real content is gitignored)
        run: cp -r content.example/. content/

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
