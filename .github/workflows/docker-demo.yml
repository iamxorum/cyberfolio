name: Docker demo image

# Builds the template with config.example (the real config is gitignored and compiled into the build,
# so an image of a real site can't be shared). Runs on release tags, or by hand from the Actions tab.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  demo-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Use example config and blog content (real ones are gitignored)
        run: |
          cp -r config.example/. src/config/
          mkdir -p content && cp -r content.example/. content/

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:demo
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}-demo
